[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpubench"
version = "0.1.0"
description = "Honest CPU vs GPU benchmarking with built-in correctness and anti-cheating guards"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ignacy_Malachowski" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
gpu = ["torch>=2.1"]
dev = ["pytest>=7"]

[project.scripts]
gpubench = "gpubench.cli:main"

[tool.setuptools]
packages = ["gpubench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
