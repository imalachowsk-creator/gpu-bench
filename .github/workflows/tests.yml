name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and end-to-end tests (GPU tests are skipped)
        run: pytest -v
      - name: Anti-cheat guards must catch every cheat
        run: python -m gpubench cheats --backend numpy --size 512
